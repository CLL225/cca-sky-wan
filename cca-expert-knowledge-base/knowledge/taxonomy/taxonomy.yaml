# Knowledge taxonomy (v0.1)
#
# Taxonomy is for organisation and retrieval, not for data typing.  An
# experience may carry tags from several categories.  Tags are stable
# machine identifiers; labels are human-facing (Chinese + English).
version: 1
categories:
