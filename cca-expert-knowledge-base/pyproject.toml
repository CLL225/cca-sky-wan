[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cca-expert-knowledge-base"
version = "0.1.0"
description = "Expert design-experience knowledge base for TCP/QUIC congestion control"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0",
    "jsonschema>=4.22",
    "numpy>=1.26",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0,<4"]
dev = ["pytest>=8.0"]

[project.scripts]
cca-kb = "cca_kb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
